[package]
name = "uscis-n400"
version = "0.1.0"
edition = "2024"
description = "The Civics Test study application."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# -- Ui
dioxus = { version = "0.7", features = ["web", "router"] }
# -- Json
serde_json = "1"
# -- Storage
rexie = "0.6"
# -- Web
js-sys = "0.3"
wasm-bindgen = "0.2"
# -- Others
derive_more = { version = "2", features = ["display", "from"] }
domain = { path = "../domain" }
