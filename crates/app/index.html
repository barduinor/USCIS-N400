<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <meta name="theme-color" content="#1b5fa8" />
    <meta name="apple-mobile-web-app-title" content="Civics Study" />
    <script>
      // The app is served from the dev server's root and from the repository
      // subpath on Pages, and the worker answers every route under whichever
      // one it was built for. The document's own URL cannot say where the app
      // is rooted: one route segment deep, a relative URL resolves one
      // directory too deep. So the root is worked out once, here: the worker's
      // own scope when a worker controls the page, which is the case for every
      // route it answers, and the document's own directory before that, which
      // is where the shell was served from. The shell's own files hang off it —
      // the stylesheet, the web app manifest, the Apple touch icon, and the
      // worker itself — and nothing in this file names the base path.
      (function () {
        var controller = navigator.serviceWorker && navigator.serviceWorker.controller;
        var root = new URL("./", controller ? controller.scriptURL : location.href);

        function add(rel, url, sizes) {
          var link = document.createElement("link");

          link.rel = rel;
          link.href = url.href;

          if (sizes) {
            link.sizes = sizes;
          }

          document.head.appendChild(link);
        }

        add("stylesheet", new URL("styles.css", root));
        add("manifest", new URL("manifest.webmanifest", root));
        add("apple-touch-icon", new URL("apple-touch-icon.png", root), "180x180");

        if (!navigator.serviceWorker) {
          return;
        }

        navigator.serviceWorker.register(new URL("sw.js", root).href).catch(function () {
          // No worker: the app still runs, it just needs the network.
        });

        // The build hashes the names of the files it emits, so the worker is
        // told which resources the page loaded instead of holding a list
        // written down here. It keeps them, and the installed app opens offline
        // after one online visit. Resources arrive as they finish: a bundle the
        // page is still downloading when the load event fires — the wasm module,
        // which the glue fetches on its own — is kept too.
        function keep(entries) {
          var resources = entries.map(function (entry) {
            return entry.name;
          });

          if (!resources.length) {
            return;
          }

          navigator.serviceWorker.ready
            .then(function (registration) {
              if (registration.active) {
                registration.active.postMessage({ resources: resources });
              }
            })
            .catch(function () {
              // No worker: nothing to keep.
            });
        }

        try {
          new PerformanceObserver(function (list) {
            keep(list.getEntries());
          }).observe({ type: "resource", buffered: true });
        } catch (error) {
          window.addEventListener("load", function () {
            keep(performance.getEntriesByType("resource"));
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
