[package]
name = "gen-questions"
version = "0.1.0"
edition = "2024"
description = "Generates the committed Civics Test records from USCIS M-1778."

[lib]
doctest = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# -- Cli
clap = { version = "4", features = ["derive"] }
# -- Json
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# -- Pdf
pdf-extract = "0.12"
# -- Others
derive_more = { version = "2", features = ["display", "from"] }
domain = { path = "../domain" }
